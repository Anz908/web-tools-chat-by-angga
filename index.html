<script>
// Isi URL Firebase di sini agar semua pengguna file ini otomatis tersambung, contoh: 'https://nama-default-rtdb.firebaseio.com'
const DEFAULT_FB='';
const $=id=>document.getElementById(id);
const ICO={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 21 12z"/>',dots:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',back:'<path d="M15 5l-7 7 7 7"/>',arch:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',unarch:'<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M12 17v-5M9.5 14.5L12 12l2.5 2.5"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',send:'<path d="M5 12l14-7-5 14-2.5-5.5L5 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5S15.5 16.5 15.5 20M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.8c1.8.7 3 2.2 3 5.2"/>',plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',pal:'<path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-.9 2-2 0-1.3-1-1.6-1-2.7 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4c0-4-4-7.7-9-7.7z"/><path d="M7.5 11h.01M10 7.5h.01M14.5 7.5h.01"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',out:'<path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',stat:'<circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6"/><circle cx="12" cy="12" r="3.2"/>',video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10l5-3v10l-5-3z"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',play:'<path d="M7 5l12 7-12 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',pin:'<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',reply:'<path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 5 5v1"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>'};
const setCS=(c,t)=>{$('cs').className='cs '+c;$('cs').querySelector('span').textContent=t+(c==='no'?' (ketuk untuk cek)':'')};
const ic=n=>`<svg viewBox="0 0 24 24">${ICO[n]}</svg>`;
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let db,me=LS('wf_me',null),users={},groups={},msgs=[],cur=null,tab=0,seeded=false,ready=false;
let st=LS('wf_style',{w:'',wi:'',mine:'#25d366',their:'#ffffff',mt:'#ffffff',tt:'#ffffff',bs:'glass',bi:''});
let archived=LS('wf_arch',[]),contacts=LS('wf_ct',[]);
const key=s=>s.trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dnm=u=>users[u]?.name||u;
const isAdm=u=>users[u]?.role==='admin';
const avStyle=u=>users[u]?.avatar?`style="background-image:url(${users[u].avatar});color:transparent"`:'';
function applyStyle(){
 document.body.classList.toggle('sq',st.mode==='sq');
 const r=document.documentElement.style,h=(c,a)=>{const n=parseInt(c.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
 r.setProperty('--mine',h(st.mine,.45));r.setProperty('--their',h(st.their,.14));r.setProperty('--mt',st.mt);r.setProperty('--tt',st.tt);
 const b=$('bg');b.style.backgroundImage=st.wi?`url(${st.wi})`:'';if(st.w&&!st.wi)b.style.background=st.w;else if(!st.w&&!st.wi)b.style.background='';
 if(st.wi){b.style.background='';b.style.backgroundImage=`url(${st.wi})`;b.style.backgroundSize='cover'}
}
applyStyle();
const fileURL=(f,max,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)};
function pickImg(max,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&fileURL(i.files[0],max,cb);i.click()}

async function boot(){
 if(me)showApp();
 try{db=await window.claude.use('db')}catch(e){db=null}
 if(!db){const fu=LS('wf_fb','')||DEFAULT_FB;if(fu)db=fbAdapter(fu.replace(/\/+$/,''));else if(!window.claude)db=mqAdapter(NS_ID)}
 if(!db){setCS('no','Tidak tersambung');$('err').textContent=window.claude?'Real-time butuh login claude.ai: buka halaman ini lewat akun claude.ai.':'Atur database real-time dulu lewat tombol di bawah.';return}
 db.collection('accounts').onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());ready=true;setCS('ok','Tersambung · real-time');
  if(s.empty&&!seeded){seeded=true;['Angga','Anz','Anzx','Whatsappfakee'].forEach(n=>db.collection('accounts').doc(key(n)).set({name:n,role:'admin',expires:0,status:'Hai, saya pakai WhatsApp Fake'}));
   db.collection('groups').doc('dex').set({name:'DEX TODS',members:['angga','anz','anzx','whatsappfakee'],all:true})}
  if(me&&users[me]&&users[me].role!=='admin'&&users[me].expires&&users[me].expires<Date.now())out('Akun kamu sudah hangus.');
  if(me&&!users[me]&&s.size)out('Akun dihapus admin.');
  if(me)render()});
 db.collection('groups').onSnapshot(s=>{groups={};s.docs.forEach(d=>groups[d.id]=d.data());
  if(!groups.dex&&me&&!heal){heal=true;Promise.resolve(db.collection('groups').doc('dex').set({name:'DEX TODS',members:[],all:true})).catch(()=>{})}
  if(me)render()});
 db.collection('stories').onSnapshot(s=>{stories=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render()});
 db.collection('msgs').onSnapshot(s=>{msgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);if(me)render()});
}
$('lb').onclick=login;$('lu').onkeydown=e=>e.key==='Enter'&&login();
function login(){
 const u=key($('lu').value);if(!u)return;
 if(!db){$('err').textContent='Menyambung ke server… coba lagi sebentar.';return}
 if(!ready){$('err').textContent='Memuat data… tunggu 2-3 detik. Kalau lama, pakai Firebase di bawah.';return}
 if(!users[u]){$('err').textContent='Username tidak terdaftar. Minta admin membuatkan.';return}
 if(users[u].role!=='admin'&&users[u].expires&&users[u].expires<Date.now()){$('err').textContent='Akun ini sudah hangus.';return}
 me=u;SV('wf_me',u);$('lb').disabled=true;rotStop=1;setAv(u);setRot('Selamat masuk');
 setTimeout(()=>{$('login').classList.add('leaving');setTimeout(()=>{showApp();$('login').classList.remove('leaving')},650)},1100);
}
function out(m){me=null;localStorage.removeItem('wf_me');cur=null;$('app').style.display='none';$('login').style.display='flex';$('err').textContent=m||'';rotStop=0;$('lb').disabled=false;$('lu').value='';setAv(null);close();hideCtx();stv.style.display='none'}
function showApp(){auto=true;nav='chat';if(tab===3)tab=0;$('login').style.display='none';$('app').style.display='block';$('app').classList.remove('enter');void $('app').offsetWidth;$('app').classList.add('enter');render()}

function chatsOf(){
 const l=[];
 Object.entries(groups).forEach(([id,g])=>{if(g.all||g.members?.includes(me))l.push({id,name:g.name,grp:1,av:g.name[0]})});
 const peers=new Set(contacts);
 msgs.forEach(m=>{if(m.cid.startsWith('dm_')){const p=m.cid.slice(3).split('_');if(p.includes(me))peers.add(p.find(x=>x!==me)||me)}});
 peers.forEach(p=>{if(users[p]&&p!==me)l.push({id:'dm_'+[me,p].sort().join('_'),name:dnm(p),peer:p,av:dnm(p)[0]})});
 l.forEach(c=>{const last=[...msgs].reverse().find(m=>m.cid===c.id);c.last=last;c.ts=last?.t||0});
 return l.sort((a,b)=>(b.id==='dex')-(a.id==='dex')||b.ts-a.ts);
}
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function render(){
 if(!me||!users[me])return;
 if(auto&&groups.dex){auto=false;open('dex');return}
 const q=nav==='chat'?key($('q').value):'';let h='';
 if(nav==='set'){h=settingsPage()}else if(q){
  Object.keys(users).filter(u=>u!==me&&(u.includes(q)||dnm(u).toLowerCase().includes(q))).forEach(u=>{h+=`<div class="row" data-u="${esc(u)}"><div class="av" ${avStyle(u)}>${esc(dnm(u)[0])}</div><div class="grow"><div class="nm">${esc(dnm(u))} ${isAdm(u)?'<span class="tag">admin</span>':''}</div><div class="sb">@${esc(u)} · ketuk untuk chat</div></div></div>`});
  if(!h)h='<div class="empty" style="padding:30px">Username tidak ditemukan</div>';
 }else{
  if(tab===3){h=statusList()}else chatsOf().filter(c=>(c.id!=='dex'&&archived.includes(c.id))===(tab===1)&&(tab!==2||unread(c.id)>0)).forEach(c=>{
   const l=c.last;const pv=l?(l.del?'Pesan dihapus':(l.from===me?tick(l)+' ':'')+mpv(l)):'Belum ada pesan';const un=unread(c.id);
   h+=`<div class="row ${cur===c.id?'on':''}" data-c="${esc(c.id)}"><div class="av" ${c.peer?avStyle(c.peer):''}>${esc(c.av)}</div><div class="grow"><div class="nm">${esc(c.name)}</div><div class="sb">${pv}</div></div><div style="text-align:right"><div class="sb" style="${un?'color:var(--acc)':''}">${l?hm(l.t):''}</div>${un?`<span class="bd">${hasMn(c.id)?'@ ':''}${un}</span>`:(c.id==='dex'?`<span class="pn">${ic('pin')}</span>`:'')}</div></div>`});
  if(!h)h=`<div class="empty" style="padding:30px">${tab?'Arsip kosong':'Belum ada chat. Cari username di atas.'}</div>`;
 }
 const isC=nav==='chat';$('q').parentElement.style.display=isC?'':'none';document.querySelector('.tabs').style.display=isC?'':'none';$('ttl').textContent={chat:'Chat',status:'Status',set:'Pengaturan'}[nav];
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.n===nav));const tu=chatsOf().reduce((a,c)=>a+unread(c.id),0);$('nbd').textContent=tu;$('nbd').style.display=tu?'':'none';
 $('list').innerHTML=h;
 $('list').querySelectorAll('.row').forEach(r=>r.onclick=()=>{
  if(r.dataset.p){act(r.dataset.p);return}if(r.dataset.add){addStory();return}if(r.dataset.s){viewStory(r.dataset.s);return}if(r.dataset.u){const u=r.dataset.u;if(!contacts.includes(u)){contacts.push(u);SV('wf_ct',contacts)}$('q').value='';open('dm_'+[me,u].sort().join('_'))}else if(r.dataset.c)open(r.dataset.c)});
 renderChat();
}
function open(id){cur=id;delete shown[id];anim($('main'));$('msgs').classList.add('sw');setTimeout(()=>$('msgs').classList.remove('sw'),700);$('wrap').classList.add('chat');render();setTimeout(()=>$('msgs').scrollTop=1e9,0)}
function renderChat(){
 if(!cur){return}
 const c=chatsOf().find(x=>x.id===cur)||{id:cur,name:cur.startsWith('dm_')?dnm(cur.slice(3).split('_').find(x=>x!==me)||me):'?',av:'?'};
 $('ch').style.display='flex';$('bar').style.display='flex';
 $('chn').textContent=c.name;$('chav').textContent=c.av;$('chav').setAttribute('style',c.peer&&users[c.peer]?.avatar?`background-image:url(${users[c.peer].avatar});color:transparent`:'');
 $('chs').textContent=c.grp?(groups[c.id].all?'Grup utama · semua anggota':groups[c.id].members.map(dnm).join(', ')):(online.has(c.peer)?'online':(users[c.peer]?.status||''));
 $('arch').style.display=cur==='dex'?'none':'';$('arch').innerHTML=ic(archived.includes(cur)?'unarch':'arch');
 const box=$('msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
 const bi=st.bi?`background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url(${st.bi});`:'';
 let lastD='';const mark=[],byId={};msgs.forEach(m=>byId[m.id]=m);
 box.innerHTML=msgs.filter(m=>m.cid===cur).map(m=>{
  const dk=new Date(m.t).toDateString();let sep='';
  if(dk!==lastD){lastD=dk;const dd=Math.round((new Date(new Date().toDateString())-new Date(dk))/864e5);sep=`<div class="ds">${dd===0?'Hari ini':dd===1?'Kemarin':new Date(m.t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>`}
  if(m.from!==me&&!(m.r||[]).includes(me))mark.push(m);
  const mine=m.from===me,ad=isAdm(m.from),nw=shown[cur]&&!shown[cur].has(m.id);
  const who=(c.grp&&!mine)?`<div class="who" style="color:${nc(m.from)}">${esc(dnm(m.from))}${ad?'<span class="tag">admin</span>':''}</div>`:(mine&&c.grp&&ad?`<div class="who">Kamu <span class="tag">admin</span></div>`:'');
  let body;
  if(m.del)body='<i style="opacity:.6">Pesan ini telah dihapus</i>';
  else{const q=m.rp&&byId[m.rp];const qh=q?`<div class="rp"><b>${esc(dnm(q.from))}</b><br>${q.del?'Pesan dihapus':q.type&&q.type!=='text'?mpv(q):esc((q.text||'').slice(0,80))}</div>`:'';
   body=qh+bodyOf(m)}
  return sep+`<div class="m ${mine?'me':''} ${nw?'nw':''} ${(m.rx&&Object.keys(m.rx).length&&!m.del)?'hr':''} ${st.bs==='solid'?'solid':''}" data-id="${m.id}" data-n="${nw?1:0}" style="${bi}${st.bs==='solid'?'border-color:transparent':''}">${who}${body}${rxh(m)}<div class="tm">${hm(m.t)}${mine&&!m.del?tick(m):''}</div></div>`}).join('')||'<div class="empty">Belum ada pesan</div>';
 shown[cur]=new Set(msgs.filter(m=>m.cid===cur).map(m=>m.id));
 mark.forEach(m=>db.collection('msgs').doc(m.id).update({r:[...(m.r||[]),me]}));
 if(near)box.scrollTop=1e9;
}
function send(o){if(!cur||!db)return;const id='m'+Date.now()+Math.random().toString(36).slice(2,6);Promise.resolve(db.collection('msgs').doc(id).set({cid:cur,from:me,t:Date.now(),r:[],...(rpId?{rp:rpId}:{}),...o})).catch(()=>{toast('Pesan gagal terkirim. Akunmu mungkin hanya punya akses lihat.');setTimeout(()=>toast(''),3800)});rpId=null;$('rpv').style.display='none'}
$('snd').onclick=()=>{const v=$('mi').value.trim();if(v){send({type:'text',text:v});$('mi').value='';$('mi').oninput()}};
$('mi').onkeydown=e=>e.key==='Enter'&&$('snd').click();
$('q').oninput=render;

function fbAdapter(base){
 const enc=id=>encodeURIComponent(id).replace(/\./g,'%2E'),dec=decodeURIComponent,U=p=>`${base}/${p}.json`;
 const chk=r=>{if(!r.ok)throw new Error(r.status===401||r.status===403?'Akses ditolak (cek Rules database)':'HTTP '+r.status);return r};
 const put=(o,parts,v)=>{if(!parts.length)return v;const[k,...r]=parts;o=(o&&typeof o==='object')?o:{};if(r.length)o[k]=put(o[k],r,v);else if(v===null||v===undefined)delete o[k];else o[k]=v;return o};
 return{collection:c=>({
  doc:id=>({set:d=>fetch(U(c+'/'+enc(id)),{method:'PUT',body:JSON.stringify(d)}).then(chk),update:d=>fetch(U(c+'/'+enc(id)),{method:'PATCH',body:JSON.stringify(d)}).then(chk),delete:()=>fetch(U(c+'/'+enc(id)),{method:'DELETE'}).then(chk)}),
  onSnapshot:cb=>{let data={};const emit=()=>{const docs=Object.entries(data).map(([id,v])=>({id:dec(id),data:()=>v}));cb({docs,empty:!docs.length,size:docs.length})};
   const es=new EventSource(U(c));
   const ev=(e,patch)=>{try{const{path,data:d}=JSON.parse(e.data);const parts=path.split('/').filter(Boolean);
    if(patch)Object.entries(d||{}).forEach(([k,v])=>{data=put(data,[...parts,...k.split('/')],v)});else data=parts.length?put(data,parts,d):(d||{});emit()}catch(x){}};
   es.addEventListener('put',e=>ev(e,false));es.addEventListener('patch',e=>ev(e,true));

 const pub=(c,id,obj)=>{const x=pkt(0x31,str(topic(c,id)),obj===null?new Uint8Array(0):TE.encode(JSON.stringify(obj)));ok?send(x):q.push(x)};

  if(!payload.length)delete store[c][id];else{try{store[c][id]=JSON.parse(TD.decode(payload))}catch(e){return}}sched(c)};
